  <text x="206" y="142" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">GATE</text>
  <text x="206" y="162" text-anchor="middle" fill="#8b949e" font-size="10">gate-first</text>
  <path class="flow-tight" d="M262,146 L270,146" fill="none" stroke="#8b949e" stroke-width="1.75"/>
  <path d="M274,146 l-7,-4.5 v9 z" fill="#8b949e"/>
  <rect x="274" y="110" width="108" height="72" rx="8" fill="#161b22" stroke="#22d3ee" stroke-width="1.25"/>
  <text x="328" y="142" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">DECOMPOSE</text>
  <text x="328" y="162" text-anchor="middle" fill="#8b949e" font-size="10">coordinate</text>
  <path class="flow-tight" d="M384,146 L392,146" fill="none" stroke="#8b949e" stroke-width="1.75"/>
  <path d="M396,146 l-7,-4.5 v9 z" fill="#8b949e"/>
