<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Gauntlet pipeline: deliberate, gate, decompose, build, verify, harden, integrate — composable with /chain">
<style>
    .flow { fill: none; stroke-width: 2; stroke-dasharray: 6 10; stroke-linecap: round; animation: march 1.1s linear infinite; }
    .flow-tight { fill: none; stroke-width: 2; stroke-dasharray: 5 8; stroke-linecap: round; animation: march 1.1s linear infinite; }
    .flow-b { animation-delay: -0.55s; }
    .lag1 { animation-delay: -0.3s; } .lag2 { animation-delay: -0.6s; } .lag3 { animation-delay: -0.9s; }
    @keyframes march { to { stroke-dashoffset: -16; } }
    .glow { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.55; } }
    .glow-green { animation: glowg 2.4s ease-in-out infinite; }
    @keyframes glowg { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }
    .breathe { animation: breathe 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    .blink-red { animation: blinkr 1.6s ease-in-out infinite; }
    @keyframes blinkr { 0%,100% { fill: #f85149; opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .flow-tight, .flow-b, .lag1, .lag2, .lag3, .glow, .glow-green, .breathe, .blink-red { animation: none; }
    }
  </style>
  <rect x="0" y="0" width="900" height="420" rx="14" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="898.5" height="418.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700" letter-spacing="2">/GAUNTLET · FULL CAMPAIGN</text>
  <text x="450" y="62" text-anchor="middle" fill="#8b949e" font-size="12">seven stages · one artifacts dir · resume-safe</text>
  <rect x="30" y="110" width="108" height="72" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="84" y="142" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">DELIBERATE</text>
  <text x="84" y="162" text-anchor="middle" fill="#8b949e" font-size="10">council / debate</text>
