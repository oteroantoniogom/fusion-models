  <text x="450" y="142" text-anchor="middle" fill="#f0b429" font-size="11" font-weight="700">BUILD</text>
  <text x="450" y="162" text-anchor="middle" fill="#8b949e" font-size="10">workers</text>
  <path class="flow-tight" d="M506,146 L514,146" fill="none" stroke="#8b949e" stroke-width="1.75"/>
  <path d="M518,146 l-7,-4.5 v9 z" fill="#8b949e"/>
  <rect x="518" y="110" width="108" height="72" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.25"/>
  <text x="572" y="142" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">VERIFY</text>
  <text x="572" y="162" text-anchor="middle" fill="#8b949e" font-size="10">gate run</text>
  <path class="flow-tight" d="M628,146 L636,146" fill="none" stroke="#8b949e" stroke-width="1.75"/>
  <path d="M640,146 l-7,-4.5 v9 z" fill="#8b949e"/>
  <rect x="640" y="110" width="108" height="72" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.25"/>
  <text x="694" y="142" text-anchor="middle" fill="#f85149" font-size="11" font-weight="700">HARDEN</text>
  <text x="694" y="162" text-anchor="middle" fill="#8b949e" font-size="10">redteam</text>
  <path class="flow-tight" d="M750,146 L758,146" fill="none" stroke="#8b949e" stroke-width="1.75"/>
  <path d="M762,146 l-7,-4.5 v9 z" fill="#8b949e"/>
  <rect x="762" y="110" width="108" height="72" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.25"/>
  <text x="816" y="142" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700">INTEGRATE</text>
  <text x="816" y="162" text-anchor="middle" fill="#8b949e" font-size="10">ship</text>
  <rect x="40" y="220" width="400" height="140" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="240" y="252" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">/gauntlet &lt;prompt&gt;</text>
  <text x="240" y="280" text-anchor="middle" fill="#e6edf3" font-size="12">runs the full preset end to end</text>
  <text x="240" y="302" text-anchor="middle" fill="#8b949e" font-size="11">--skip-council · --skip-redteam</text>
  <text x="240" y="324" text-anchor="middle" fill="#8b949e" font-size="11">--deliberate=council|debate · --resume</text>
  <rect x="460" y="220" width="400" height="140" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="660" y="252" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">/chain &lt;stages&gt; &lt;prompt&gt;</text>
  <text x="660" y="280" text-anchor="middle" fill="#e6edf3" font-size="12">compose any ordered subset</text>
  <text x="660" y="302" text-anchor="middle" fill="#8b949e" font-size="11">e.g. gate,build,verify</text>
  <text x="660" y="324" text-anchor="middle" fill="#8b949e" font-size="11">prereqs validated before any spawn</text>
  <text x="450" y="396" text-anchor="middle" fill="#484f58" font-size="11">factory node &#183; coordination modes as stages &#183; clean-room children throughout</text>
</svg>
