<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="MODEL FUSION - blue and amber energy streams colliding above a keyboard - AND, not OR">
  <style>
    .stream-l { fill: none; stroke-linecap: round; stroke-dasharray: 14 18; animation: march 1.4s linear infinite; }
    .stream-r { fill: none; stroke-linecap: round; stroke-dasharray: 14 18; animation: march 1.4s linear infinite reverse; }
    .lag1 { animation-delay: -0.35s; } .lag2 { animation-delay: -0.7s; } .lag3 { animation-delay: -1.05s; }
    @keyframes march { to { stroke-dashoffset: -32; } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    .breathe { animation: breathe 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .spark { animation: spark 1.8s ease-in-out infinite; }
    @keyframes spark { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
    .title-glow { animation: titleGlow 3.2s ease-in-out infinite; }
    @keyframes titleGlow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .stream-l, .stream-r, .lag1, .lag2, .lag3, .pulse, .breathe, .spark, .title-glow { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1a1f2a"/>
      <stop offset="55%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="bluePlasma" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="amberPlasma" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <radialGradient id="coreBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 0.9 0 0 0  0 0 0.4 0 0  0 0 0 0.9 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgVignette)"/>

  <ellipse cx="600" cy="620" rx="520" ry="70" fill="url(#desk)" opacity="0.95"/>
  <ellipse cx="600" cy="610" rx="480" ry="48" fill="#0a0c10" stroke="#21262d" stroke-width="1"/>

  <g transform="translate(0,8)">
    <rect x="390" y="470" width="420" height="18" rx="4" fill="#1c212b" stroke="#30363d" stroke-width="1"/>
    <rect x="410" y="430" width="380" height="42" rx="3" fill="#12151c" stroke="#30363d" stroke-width="1"/>
    <g opacity="0.55">
      <rect x="430" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="450" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="470" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="490" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="510" y="442" width="14" height="10" rx="2" fill="#3a4554"/>
      <rect x="530" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="550" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="570" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="590" y="442" width="28" height="10" rx="2" fill="#2a313c"/>
      <rect x="624" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="644" y="442" width="14" height="10" rx="2" fill="#f0b429" opacity="0.7"/>
      <rect x="664" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="684" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="704" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="724" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
      <rect x="744" y="442" width="14" height="10" rx="2" fill="#2a313c"/>
    </g>
    <ellipse cx="600" cy="455" rx="160" ry="28" fill="#fbbf24" opacity="0.08"/>
  </g>

  <g opacity="0.9">
    <ellipse cx="470" cy="500" rx="70" ry="28" fill="#2a221c" transform="rotate(-12 470 500)"/>
    <ellipse cx="730" cy="500" rx="70" ry="28" fill="#2a221c" transform="rotate(12 730 500)"/>
    <ellipse cx="500" cy="485" rx="22" ry="14" fill="#3a3028" transform="rotate(-18 500 485)"/>
    <ellipse cx="700" cy="485" rx="22" ry="14" fill="#3a3028" transform="rotate(18 700 485)"/>
  </g>

  <g filter="url(#softGlow)">
    <path class="stream-l" d="M40,210 C180,190 320,230 470,270" stroke="url(#bluePlasma)" stroke-width="3.5" opacity="0.95"/>
    <path class="stream-l lag1" d="M50,250 C200,220 340,250 480,285" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <path class="stream-l lag2" d="M60,180 C210,170 350,210 475,265" stroke="#7dd3fc" stroke-width="1.5" opacity="0.55"/>
    <path class="stream-l lag3" d="M30,230 C170,260 330,280 465,290" stroke="#bae6fd" stroke-width="1.25" opacity="0.45"/>
  </g>
  <circle class="pulse" cx="490" cy="278" r="46" fill="url(#blueOrb)"/>
  <circle class="breathe" cx="490" cy="278" r="18" fill="#e0f2fe" opacity="0.9"/>

  <g filter="url(#softGlow)">
    <path class="stream-r" d="M1160,210 C1020,190 880,230 730,270" stroke="url(#amberPlasma)" stroke-width="3.5" opacity="0.95"/>
    <path class="stream-r lag1" d="M1150,250 C1000,220 860,250 720,285" stroke="#fb923c" stroke-width="2" opacity="0.7"/>
    <path class="stream-r lag2" d="M1140,180 C990,170 850,210 725,265" stroke="#fdba74" stroke-width="1.5" opacity="0.55"/>
    <path class="stream-r lag3" d="M1170,230 C1030,260 870,280 735,290" stroke="#fed7aa" stroke-width="1.25" opacity="0.45"/>
  </g>
  <circle class="pulse" cx="710" cy="278" r="46" fill="url(#amberOrb)"/>
  <circle class="breathe" cx="710" cy="278" r="18" fill="#ffedd5" opacity="0.9"/>

  <g filter="url(#bloom)" class="breathe">
    <circle cx="600" cy="270" r="70" fill="url(#coreBurst)" opacity="0.95"/>
    <circle class="pulse" cx="600" cy="270" r="28" fill="#ffffff"/>
  </g>
  <g class="spark">
    <circle cx="560" cy="230" r="2.5" fill="#fef08a"/>
    <circle cx="640" cy="225" r="2" fill="#fdba74"/>
    <circle cx="585" cy="310" r="1.8" fill="#7dd3fc"/>
    <circle cx="630" cy="305" r="2.2" fill="#fb923c"/>
    <circle cx="545" cy="275" r="1.5" fill="#ffffff"/>
    <circle cx="655" cy="268" r="1.6" fill="#ffffff"/>
  </g>

  <text class="title-glow" x="600" y="380" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="10">MODEL FUSION</text>
  <text x="600" y="412" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">AND, NOT OR &#183; COMBINE COMPUTE</text>

  <g transform="translate(48,610)" fill="#c9d1d9" opacity="0.75">
    <rect x="0" y="4" width="18" height="18" rx="2"/>
    <rect x="20" y="16" width="8" height="6" rx="1"/>
    <path d="M56,4 C68,4 72,22 60,26 C48,30 44,12 56,4 Z" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <path d="M92,13 l6,-9 6,9 -2.5,0 0,10 -7,0 0,-10 z" fill="#f97316"/>
  </g>

  <text x="600" y="658" text-anchor="middle" fill="#484f58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">fusion-harness &#183; next-level hero</text>
</svg>
