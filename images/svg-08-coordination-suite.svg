  <text x="626" y="266" text-anchor="middle" fill="#e6edf3" font-size="11">synthesize</text>
  <text x="626" y="286" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">multi-model</text>
  <text x="626" y="306" text-anchor="middle" fill="#484f58" font-size="10">K+1 agents</text>
  <rect x="720" y="84" width="160" height="260" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
