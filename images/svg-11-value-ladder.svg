<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="Value ladder: original three commands, five coordination modes, then gauntlet composite pipeline and /chain composer">
  <rect x="0" y="0" width="860" height="300" rx="14" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="858.5" height="298.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="430" y="40" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700" letter-spacing="2">VALUE LADDER</text>
  <text x="430" y="62" text-anchor="middle" fill="#8b949e" font-size="12">from three commands &#8594; a coordination suite &#8594; a factory pipeline</text>
  <rect x="30" y="90" width="250" height="150" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="155" y="122" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">1 · FOUNDATION</text>
  <text x="155" y="152" text-anchor="middle" fill="#e6edf3" font-size="13">/opinion</text>
  <text x="155" y="174" text-anchor="middle" fill="#e6edf3" font-size="13">/fusion</text>
  <text x="155" y="196" text-anchor="middle" fill="#e6edf3" font-size="13">/auto-validate</text>
  <text x="155" y="218" text-anchor="middle" fill="#8b949e" font-size="11">upstream core</text>
  <rect x="320" y="90" width="250" height="150" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="445" y="122" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">2 · COORDINATION</text>
  <text x="445" y="152" text-anchor="middle" fill="#e6edf3" font-size="12">/parallel · /debate</text>
  <text x="445" y="174" text-anchor="middle" fill="#e6edf3" font-size="12">/coordinate · /council</text>
  <text x="445" y="196" text-anchor="middle" fill="#e6edf3" font-size="12">/redteam</text>
  <text x="445" y="218" text-anchor="middle" fill="#8b949e" font-size="11">+ multi-provider cast</text>
  <rect x="610" y="90" width="220" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="720" y="122" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">3 · FACTORY</text>
  <text x="720" y="152" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">/gauntlet</text>
  <text x="720" y="174" text-anchor="middle" fill="#8b949e" font-size="11">7-stage campaign</text>
  <text x="720" y="196" text-anchor="middle" fill="#e6edf3" font-size="13">/chain</text>
  <text x="720" y="218" text-anchor="middle" fill="#8b949e" font-size="11">compose any subset</text>
  <text x="295" y="165" fill="#484f58" font-size="20">&#8594;</text>
  <text x="585" y="165" fill="#484f58" font-size="20">&#8594;</text>
  <text x="430" y="278" text-anchor="middle" fill="#484f58" font-size="11">same spawn machinery &#183; same two-column DX &#183; same clean-room children</text>
</svg>
